name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Cache Hugging Face model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-dima806-facial-emotions-747cf16

      - name: Install dependencies
        run: |
          pip install -r requirements-torch.txt
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app

      - name: Test (pytest)
        run: pytest -q

  build-docker:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t lifeverse-backend:ci backend

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t lifeverse-frontend:ci frontend

      - name: Smoke-test backend container
        run: |
          docker run -d --name backend-smoke -p 8000:8000 lifeverse-backend:ci
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          echo "backend did not become healthy in time"
          docker logs backend-smoke
          exit 1
